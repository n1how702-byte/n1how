<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs 性別平權-情境題</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 30%, #d4fc79 30%, #96e6a1 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 頁首 Header */
        header {
            height: 60px;
            background-color: #4a148c;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 20;
        }

        header h1 {
            font-size: 22px;
            font-weight: bold;
        }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 7px 18px;
            border-radius: 20px;
        }

        /* 遊戲地圖區域 */
        #map {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* 遊樂園背景裝飾 (純CSS與Emoji) */
        .park-facility {
            position: absolute;
            font-size: 50px;
            opacity: 0.7;
            pointer-events: none;
            z-index: 2;
        }

        /* 可點擊的花朵圖示 (位於網頁下半部大草地上) */
        .interactive-flower {
            position: absolute;
            width: 90px;
            height: 90px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, filter 0.2s;
            z-index: 10;
            animation: swingFlower 2.5s ease-in-out infinite alternate;
        }

        .interactive-flower:hover {
            transform: scale(1.25) !important;
            filter: drop-shadow(0 6px 15px rgba(255, 105, 180, 0.7));
        }

        .flower-icon {
            font-size: 55px;
            line-height: 1;
        }

        .flower-label {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ad1457;
            color: #880e4f;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 2px;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        @keyframes swingFlower {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        /* Modal 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #ffffff;
            width: 95%;
            max-width: 700px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .quiz-title {
            font-size: 22px;
            color: #6a1b9a;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .cards-pool {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            min-height: 110px;
            background: #f3e5f5;
            padding: 15px;
            border-radius: 16px;
            border: 2px dashed #ab47bc;
        }

        .drag-card {
            background: #ffffff;
            border: 1px solid #8e24aa;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 600;
            color: #4a148c;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .drag-card.selected {
            background: #e1bee7;
            border-color: #6a1b9a;
            transform: scale(1.03);
        }

        .drop-zones-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .drop-zone {
            flex: 1;
            min-height: 140px;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
        }

        .drop-zone-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .zone-equal {
            background: #e8f5e9;
            border: 2px dashed #4caf50;
            color: #1b5e20;
        }

        .zone-unequal {
            background: #ffebee;
            border: 2px dashed #f44336;
            color: #b71c1c;
        }

        .submit-btn {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(142, 36, 170, 0.4);
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #8e24aa, #4a148c);
        }

        .result-card h2 {
            font-size: 30px;
            color: #4a148c;
            margin-bottom: 15px;
        }

        .result-level {
            font-size: 36px;
            font-weight: bold;
            margin: 15px 0;
        }

        .result-desc {
            font-size: 17px;
            color: #444;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .action-btn {
            background: #8e24aa;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 6px 15px rgba(142, 36, 170, 0.3);
        }

        .action-btn:hover {
            background: #6a1b9a;
        }
    </style>
</head>
<body>

    <header>
        <h1>SDGs 性別平權-情境題</h1>
        <div class="score-board">答對題數：<span id="correct-count">0</span> / 6</div>
    </header>

    <main id="map"></main>

    <!-- 題目對話框 -->
    <div class="modal-overlay" id="quiz-modal" style="display: none;">
        <div class="modal-content">
            <div class="quiz-title" id="group-title">🌸 花朵題组</div>
            <p style="font-size: 15px; color: #555; margin-bottom: 15px;">
                💡 <b>操作方式</b>：點擊下方卡片選取，再點擊對應的框框即可放入！
            </p>

            <div class="cards-pool" id="cards-pool" ondragover="allowDrop(event)" ondrop="drop(event, 'pool')"></div>

            <div class="drop-zones-container">
                <div class="drop-zone zone-equal" id="zone-equal" ondragover="allowDrop(event)" ondrop="drop(event, 'equal')" onclick="clickZone('equal')">
                    <div class="drop-zone-title">🟢 性別平等 (點此放入)</div>
                </div>
                <div class="drop-zone zone-unequal" id="zone-unequal" ondragover="allowDrop(event)" ondrop="drop(event, 'unequal')" onclick="clickZone('unequal')">
                    <div class="drop-zone-title">🔴 性別不平等 (點此放入)</div>
                </div>
            </div>

            <button class="submit-btn" onclick="submitGroupAnswer()">確認提交</button>
        </div>
    </div>

    <!-- 遊戲結果結算彈窗 -->
    <div class="modal-overlay" id="result-modal" style="display: none;">
        <div class="modal-content result-card">
            <h2>🏆 本關完成！</h2>
            <div class="result-level" id="result-level-text"></div>
            <p class="result-desc" id="result-desc-text"></p>
            <div id="result-action-area"></div>
        </div>
    </div>

    <script>
        const questionGroups = [
            {
                groupId: 0,
                title: "🌸 題組一：家務與職涯選擇",
                items: [
                    { id: "q1", text: "「家事與照顧小孩是全家人的事，爸爸媽媽共同分擔。」", type: "equal" },
                    { id: "q2", text: "「男生數理比較好，女生比較適合學人文設計。」", type: "unequal" }
                ]
            },
            {
                groupId: 1,
                title: "🌺 題組二：職場與情感表達",
                items: [
                    { id: "q3", text: "「男女同工同酬，晉升機會依能力與績效決定。」", type: "equal" },
                    { id: "q4", text: "「男兒有淚不輕彈，男生哭泣就是軟弱的表現。」", type: "unequal" }
                ]
            },
            {
                groupId: 2,
                title: "🌻 題組三：社會參與與尊重",
                items: [
                    { id: "q5", text: "「任何人不論性別，皆可自由選擇穿著與興趣。」", type: "equal" },
                    { id: "q6", text: "「女性結婚懷孕後，就應該主動辭職在家帶小孩。」", type: "unequal" }
                ]
            }
        ];

        let currentGroupIndex = -1;
        let totalCorrectCount = 0;
        let completedGroupsCount = 0;
        let selectedCardEl = null;

        const map = document.getElementById('map');
        const quizModal = document.getElementById('quiz-modal');
        const resultModal = document.getElementById('result-modal');
        const correctCountEl = document.getElementById('correct-count');

        function initMap() {
            // 上半部遊樂園景點裝飾
            const facilities = [
                { icon: '🎡', top: '8%', left: '15%' },
                { icon: '🏰', top: '6%', left: '50%' },
                { icon: '🎠', top: '10%', left: '82%' }
            ];

            facilities.forEach(f => {
                const fac = document.createElement('div');
                fac.className = 'park-facility';
                fac.innerText = f.icon;
                fac.style.top = f.top;
                fac.style.left = f.left;
                map.appendChild(fac);
            });

            // 下半部大草地上的 3 朵花朵
            const flowers = ['🌸', '🌺', '🌻'];
            const flowerPositions = [
                { top: '68%', left: '20%' },
                { top: '65%', left: '50%' },
                { top: '70%', left: '80%' }
            ];

            questionGroups.forEach((group, index) => {
                const flower = document.createElement('div');
                flower.className = 'interactive-flower';
                flower.style.top = flowerPositions[index].top;
                flower.style.left = flowerPositions[index].left;
                flower.id = `flower-${index}`;

                flower.innerHTML = `
                    <div class="flower-icon">${flowers[index]}</div>
                    <div class="flower-label">花朵 ${index + 1}</div>
                `;

                flower.onclick = () => openQuizGroup(index);
                map.appendChild(flower);
            });
        }

        function openQuizGroup(groupIndex) {
            currentGroupIndex = groupIndex;
            const group = questionGroups[groupIndex];

            document.getElementById('group-title').innerText = group.title;
            
            const pool = document.getElementById('cards-pool');
            const zoneEqual = document.getElementById('zone-equal');
            const zoneUnequal = document.getElementById('zone-unequal');

            pool.innerHTML = '';
            zoneEqual.innerHTML = '<div class="drop-zone-title">🟢 性別平等 (點此放入)</div>';
            zoneUnequal.innerHTML = '<div class="drop-zone-title">🔴 性別不平等 (點此放入)</div>';
            selectedCardEl = null;

            const shuffledItems = [...group.items].sort(() => Math.random() - 0.5);

            shuffledItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'drag-card';
                card.innerText = item.text;
                card.draggable = true;
                card.dataset.id = item.id;
                card.dataset.type = item.type;

                card.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', item.id);
                };

                card.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.drag-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedCardEl = card;
                };

                pool.appendChild(card);
            });

            quizModal.style.display = 'flex';
        }

        function allowDrop(e) { e.preventDefault(); }

        function drop(e, targetZone) {
            e.preventDefault();
            const cardId = e.dataTransfer.getData('text/plain');
            const card = document.querySelector(`[data-id="${cardId}"]`);
            moveCardToZone(card, targetZone);
        }

        function clickZone(targetZone) {
            if (selectedCardEl) {
                moveCardToZone(selectedCardEl, targetZone);
                selectedCardEl.classList.remove('selected');
                selectedCardEl = null;
            }
        }

        function moveCardToZone(card, targetZone) {
            if (!card) return;
            if (targetZone === 'equal') {
                document.getElementById('zone-equal').appendChild(card);
            } else if (targetZone === 'unequal') {
                document.getElementById('zone-unequal').appendChild(card);
            } else if (targetZone === 'pool') {
                document.getElementById('cards-pool').appendChild(card);
            }
        }

        function submitGroupAnswer() {
            const poolCards = document.getElementById('cards-pool').children;
            if (poolCards.length > 0) {
                alert("請將所有卡牌都分類放置於框框中再提交喔！");
                return;
            }

            const group = questionGroups[currentGroupIndex];
            let groupCorrect = 0;

            const equalZoneCards = document.getElementById('zone-equal').querySelectorAll('.drag-card');
            equalZoneCards.forEach(card => {
                if (card.dataset.type === 'equal') groupCorrect++;
            });

            const unequalZoneCards = document.getElementById('zone-unequal').querySelectorAll('.drag-card');
            unequalZoneCards.forEach(card => {
                if (card.dataset.type === 'unequal') groupCorrect++;
            });

            totalCorrectCount += groupCorrect;
            correctCountEl.innerText = totalCorrectCount;

            const flowerEl = document.getElementById(`flower-${currentGroupIndex}`);
            if (flowerEl) {
                flowerEl.style.display = 'none';
            }

            quizModal.style.display = 'none';
            completedGroupsCount++;

            if (completedGroupsCount === questionGroups.length) {
                setTimeout(showFinalResult, 400);
            }
        }

        function showFinalResult() {
            const levelTextEl = document.getElementById('result-level-text');
            const descTextEl = document.getElementById('result-desc-text');
            const actionArea = document.getElementById('result-action-area');

            if (totalCorrectCount <= 3) {
                levelTextEl.innerText = "💪 等級：再加油";
                levelTextEl.style.color = "#d32f2f";
                descTextEl.innerText = `您答對了 ${totalCorrectCount} / 6 題。對於性別平權的觀念還需要再加強喔！`;
                actionArea.innerHTML = `<button onclick="location.reload()" class="action-btn">再次挑戰</button>`;
            } else if (totalCorrectCount <= 5) {
                levelTextEl.innerText = "🌱 等級：進步中";
                levelTextEl.style.color = "#f57c00";
                descTextEl.innerText = `您答對了 ${totalCorrectCount} / 6 題。表現相當不錯，距離成為平權達人只差一步了！`;
                actionArea.innerHTML = `<button onclick="location.reload()" class="action-btn">再次挑戰</button>`;
            } else {
                levelTextEl.innerText = "🏆 等級：平權達人";
                levelTextEl.style.color = "#2e7d32";
                descTextEl.innerText = `太完美了！您 6 題全對，具備豐富且正確的 SDGs 性別平權觀念！`;
                actionArea.innerHTML = `<a href="certificate.html" class="action-btn">下載學習證書 🎓</a>`;
            }

            resultModal.style.display = 'flex';
        }

        window.onload = initMap;
    </script>
</body>
</html>
